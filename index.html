<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>혜택알리미 2.0</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#17243b;background:#f5f8fd}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e6ebf3;padding:17px 22px}.brand{max-width:900px;margin:auto;font-weight:850;color:#1555b7;font-size:19px}.brand small{font-size:12px;color:#8491a5;font-weight:600;margin-left:8px}main{max-width:900px;margin:45px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4eaf4;border-radius:20px;padding:30px;box-shadow:0 12px 35px #203f7310}.auth{max-width:470px;margin:auto}.eyebrow{font-size:13px;color:#2563eb;font-weight:800}h1{font-size:27px;margin:9px 0 8px}p{color:#64748b;line-height:1.65}.tabs{display:flex;background:#f0f4fb;border-radius:12px;padding:5px;gap:5px;margin:24px 0}.tabs button{border:0;border-radius:9px;flex:1;background:transparent;padding:12px;color:#64748b;font-weight:700}.tabs button.active{background:#fff;color:#1d4ed8;box-shadow:0 2px 9px #0000000c}label{display:block;margin:16px 0 7px;font-size:14px;font-weight:750}input{width:100%;border:1px solid #d8e1ef;border-radius:11px;padding:13px 14px;outline:none;background:#fff}input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f620}.primary{width:100%;background:#2563eb;color:#fff;border:0;border-radius:11px;padding:14px;margin-top:23px;font-weight:800}.primary:disabled{opacity:.55;cursor:wait}.secondary{border:1px solid #d8e1ef;border-radius:10px;background:#fff;padding:10px 15px;font-weight:700}.msg{margin-top:17px;border-radius:10px;padding:13px;font-size:14px;line-height:1.6;white-space:pre-wrap}.msg.ok{background:#ecfdf5;color:#065f46}.msg.error{background:#fef2f2;color:#991b1b}.muted{font-size:12px;color:#8491a5;margin-top:18px}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.mini{background:#f7faff;border:1px solid #e4edfb;border-radius:14px;padding:20px}.mini h3{margin:0 0 8px;font-size:17px}.mini p{font-size:14px;margin:0}.tag{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:5px 9px;border-radius:100px;font-size:12px;font-weight:800}#dashboard{display:none}@media(max-width:600px){main{margin:25px auto}.card{padding:22px}.grid{grid-template-columns:1fr}.topline{align-items:flex-start;flex-direction:column}h1{font-size:24px}}
</style></head><body><header><div class="brand">✦ 혜택알리미 <small>ALL · 2.0</small></div></header><main>
<section id="auth" class="card auth"><span class="eyebrow">모든 직장인을 위한 복리후생 관리</span><h1>내 회사의 혜택을<br>한눈에 확인하세요</h1><p>이메일로 가입하고, 나에게 맞는 복리후생을 관리해 보세요.</p><div class="tabs"><button type="button" id="loginTab" class="active">로그인</button><button type="button" id="signupTab">회원가입</button></div><form id="authForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com" required><label for="password">비밀번호</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="6자 이상 입력" required><button class="primary" id="authButton" type="submit">로그인</button></form><div id="authMessage" role="status" aria-live="polite"></div><p class="muted">기존 린나이코리아 앱과 별도의 계정 및 데이터베이스를 사용합니다.</p></section>
<section id="dashboard"><div class="card"><div class="topline"><div><span class="eyebrow">혜택알리미 2.0</span><h1>반가워요! 👋</h1><p id="userEmail"></p></div><button class="secondary" id="logoutButton">로그아웃</button></div><div class="tag">내 기본정보</div><form id="profileForm"><label for="fullName">이름 (선택)</label><input id="fullName" maxlength="100" placeholder="이름"><label for="companyName">회사명</label><input id="companyName" maxlength="150" placeholder="근무 중인 회사명"><label for="hireDate">입사일</label><input id="hireDate" type="date"><button type="submit" class="primary" id="saveButton">기본정보 저장</button></form><div id="profileMessage" role="status" aria-live="polite"></div></div><div class="grid"><div class="mini"><h3>👨‍👩‍👧 가족정보</h3><p>다음 버전에서 가족 등록 기능을 연결할 예정이에요.</p></div><div class="mini"><h3>📄 회사 복리후생규정</h3><p>다음 버전에서 안전한 파일 업로드와 검토 기능을 추가할 예정이에요.</p></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const SUPABASE_URL='https://jjbbgucybpaothmcfbpd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_37eoozXwUXc8aBP62yJaBg_bRkVv8LT';
const $=id=>document.getElementById(id);
const auth=$('auth'),dashboard=$('dashboard');
let client=null,mode='login',activeUserId=null;
function message(id,txt,isError=false){const el=$(id);el.className=txt?'msg '+(isError?'error':'ok'):'';el.textContent=txt;}
function setMode(next){mode=next;$('loginTab').classList.toggle('active',mode==='login');$('signupTab').classList.toggle('active',mode==='signup');$('authButton').textContent=mode==='login'?'로그인':'회원가입';$('password').autocomplete=mode==='login'?'current-password':'new-password';message('authMessage','');}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
function readableError(e){const msg=String(e?.message||e||'알 수 없는 오류');if(/Invalid login credentials/i.test(msg))return '이메일 또는 비밀번호가 올바르지 않아요. 이메일 인증 여부도 확인해 주세요.';if(/Email not confirmed/i.test(msg))return '이메일 인증이 필요해요. 메일함을 확인해 주세요.';if(/Failed to fetch|NetworkError/i.test(msg))return '연결할 수 없어요. 인터넷 연결과 Supabase 프로젝트 URL을 확인해 주세요.';return msg;}
async function showUser(user){if(!user){activeUserId=null;auth.style.display='block';dashboard.style.display='none';return;}activeUserId=user.id;auth.style.display='none';dashboard.style.display='block';$('userEmail').textContent=user.email||'';message('profileMessage','');$('fullName').value='';$('companyName').value='';$('hireDate').value='';const {data,error}=await client.from('profiles').select('full_name,company_name,hire_date').eq('id',user.id).maybeSingle();if(activeUserId!==user.id)return;if(error){message('profileMessage','기본정보를 불러오지 못했어요: '+readableError(error),true);return;}if(data){$('fullName').value=data.full_name||'';$('companyName').value=data.company_name||'';$('hireDate').value=data.hire_date||'';}}
$('authForm').onsubmit=async e=>{e.preventDefault();if(!client)return;const email=$('email').value.trim(),password=$('password').value;const button=$('authButton');button.disabled=true;message('authMessage','');try{if(mode==='signup'){const {data,error}=await client.auth.signUp({email,password});if(error)throw error;if(data.session){await showUser(data.user);}else{message('authMessage','가입 요청을 처리했어요. 이메일 인증이 활성화되어 있다면 인증 메일의 링크를 누른 뒤 로그인해 주세요.\n이미 가입된 이메일이라면 기존 계정으로 로그인해 주세요.');}}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await showUser(data.user);}}catch(err){message('authMessage',readableError(err),true);}finally{button.disabled=false;}};
$('profileForm').onsubmit=async e=>{e.preventDefault();if(!client||!activeUserId)return;const button=$('saveButton');button.disabled=true;message('profileMessage','');try{const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user||user.id!==activeUserId)throw new Error('로그인이 만료됐어요. 다시 로그인해 주세요.');const payload={id:user.id,full_name:$('fullName').value.trim()||null,company_name:$('companyName').value.trim()||null,hire_date:$('hireDate').value||null};const {error}=await client.from('profiles').upsert(payload,{onConflict:'id'});if(error)throw error;message('profileMessage','기본정보가 저장됐어요!');}catch(err){message('profileMessage','저장 실패: '+readableError(err),true);}finally{button.disabled=false;}};
$('logoutButton').onclick=async()=>{if(!client)return;const {error}=await client.auth.signOut();if(error){message('profileMessage',readableError(error),true);return;}await showUser(null);};
(async()=>{try{if(!window.supabase?.createClient)throw new Error('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session?.user)await showUser(data.session.user);client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showUser(null);});}catch(err){message('authMessage','초기 연결 오류: '+readableError(err),true);}})();
</script></body></html>
